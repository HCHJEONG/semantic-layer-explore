<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Semantic Layer Explore monorepo architecture interview diagram</title>
  <desc id="desc">Plain architecture diagram showing browser and devices entering Next.js and Go Gateway, Kafka event flow, NestJS worker processing, PostgreSQL authority, Neo4j projection, and optional Kubernetes worker exercise.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="dashArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #475569; }
      .section { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 10; }
      .sectionTitle { font: 700 18px Arial, sans-serif; fill: #334155; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 8; }
      .boxBlue { fill: #eff6ff; stroke: #2563eb; }
      .boxGreen { fill: #f0fdf4; stroke: #16a34a; }
      .boxAmber { fill: #fffbeb; stroke: #d97706; }
      .boxRose { fill: #fff1f2; stroke: #e11d48; }
      .boxViolet { fill: #f5f3ff; stroke: #7c3aed; }
      .boxGray { fill: #f8fafc; stroke: #64748b; }
      .label { font: 700 17px Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 13px Arial, sans-serif; fill: #475569; }
      .tiny { font: 400 12px Arial, sans-serif; fill: #64748b; }
      .mono { font: 400 13px Consolas, monospace; fill: #334155; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .arrowThin { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .arrowDashed { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 7; marker-end: url(#dashArrow); }
      .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1000"/>
  <text class="title" x="60" y="58">Semantic Layer Explore: Polyglot Monorepo Architecture</text>
  <text class="subtitle" x="60" y="88">Interview view: boundaries, event flow, Kubernetes exercise, and source-of-truth decisions</text>

  <rect class="section" x="50" y="125" width="295" height="250"/>
  <text class="sectionTitle" x="72" y="158">External Users and Devices</text>
  <rect class="box boxBlue" x="82" y="190" width="230" height="70"/>
  <text class="label" x="107" y="220">Browser / Operator</text>
  <text class="small" x="107" y="244">dashboard, commands, explain</text>
  <rect class="box boxGreen" x="82" y="285" width="230" height="70"/>
  <text class="label" x="107" y="315">Virtual / MQTT Devices</text>
  <text class="small" x="107" y="339">telemetry and command ACKs</text>

  <rect class="section" x="390" y="125" width="870" height="500"/>
  <text class="sectionTitle" x="412" y="158">Application Services in the Monorepo</text>
  <rect class="box boxBlue" x="430" y="190" width="210" height="92"/>
  <text class="label" x="458" y="222">Next.js App</text>
  <text class="small" x="458" y="247">root-level UI + thin BFF</text>
  <text class="mono" x="458" y="268">app/, components/, lib/</text>

  <rect class="box boxAmber" x="720" y="190" width="250" height="118"/>
  <text class="label" x="748" y="222">Go Gateway</text>
  <text class="small" x="748" y="247">HTTP, SSE, MQTT boundary</text>
  <text class="small" x="748" y="269">Kafka producer and read APIs</text>
  <text class="mono" x="748" y="291">api/</text>

  <rect class="box boxAmber" x="430" y="372" width="220" height="98"/>
  <text class="label" x="459" y="404">Mosquitto</text>
  <text class="small" x="459" y="429">MQTT broker</text>
  <text class="small" x="459" y="451">device topics</text>

  <rect class="box boxRose" x="720" y="372" width="250" height="128"/>
  <text class="label" x="748" y="404">Kafka</text>
  <text class="small" x="748" y="429">async event buffer</text>
  <text class="mono" x="748" y="452">telemetry.raw</text>
  <text class="mono" x="748" y="474">command.result / DLQ</text>

  <rect class="box boxViolet" x="1030" y="335" width="250" height="150"/>
  <text class="label" x="1058" y="367">NestJS / Mastra Worker x N</text>
  <text class="small" x="1058" y="392">Kafka consumer group</text>
  <text class="small" x="1058" y="414">validation, rules, idempotency</text>
  <text class="small" x="1058" y="436">conditional AI workflow</text>
  <text class="mono" x="1058" y="462">worker/</text>

  <rect class="box boxGreen" x="1030" y="530" width="250" height="80"/>
  <text class="label" x="1058" y="562">Rust Graph Worker</text>
  <text class="small" x="1058" y="587">rebuilds graph projection</text>

  <rect class="section" x="390" y="655" width="870" height="210"/>
  <text class="sectionTitle" x="412" y="688">State and Semantic Read Models</text>
  <rect class="box boxGreen" x="430" y="722" width="255" height="92"/>
  <text class="label" x="458" y="754">PostgreSQL</text>
  <text class="small" x="458" y="779">authoritative operational store</text>
  <text class="small" x="458" y="801">unique event IDs absorb redelivery</text>
  <rect class="box boxGreen" x="750" y="722" width="220" height="92"/>
  <text class="label" x="778" y="754">Outbox Events</text>
  <text class="small" x="778" y="779">relation changes and rebuilds</text>
  <text class="mono" x="778" y="801">semantic.graph.rebuild</text>
  <rect class="box boxGreen" x="1030" y="722" width="210" height="92"/>
  <text class="label" x="1058" y="754">Neo4j</text>
  <text class="small" x="1058" y="779">rebuildable semantic</text>
  <text class="small" x="1058" y="801">read projection</text>

  <rect class="section" x="1345" y="125" width="335" height="500"/>
  <text class="sectionTitle" x="1367" y="158">Kubernetes View</text>
  <rect class="box boxGray" x="1380" y="190" width="260" height="88"/>
  <text class="label" x="1404" y="222">kind Cluster</text>
  <text class="small" x="1404" y="247">optional local exercise</text>
  <text class="small" x="1404" y="269">not the default runtime</text>
  <rect class="box boxViolet" x="1380" y="315" width="260" height="112"/>
  <text class="label" x="1404" y="347">Active K8s Workload</text>
  <text class="small" x="1404" y="372">Nest worker Deployment</text>
  <text class="small" x="1404" y="394">replica 1 first, HPA draft later</text>
  <text class="mono" x="1404" y="416">k8s/nest-worker/</text>
  <rect class="note" x="1380" y="470" width="260" height="108"/>
  <text class="small" x="1404" y="498">Frontend, Go Gateway, Kafka,</text>
  <text class="small" x="1404" y="520">PostgreSQL, Mosquitto, Neo4j</text>
  <text class="small" x="1404" y="542">remain in Compose for the</text>
  <text class="small" x="1404" y="564">verified kind exercise.</text>

  <rect class="section" x="50" y="655" width="295" height="210"/>
  <text class="sectionTitle" x="72" y="688">Contracts and Meaning</text>
  <rect class="box boxGray" x="82" y="722" width="230" height="92"/>
  <text class="label" x="107" y="754">JSON Schema Contracts</text>
  <text class="small" x="107" y="779">language-neutral messages</text>
  <text class="mono" x="107" y="801">contracts/*.schema.json</text>
  <rect class="box boxGray" x="82" y="830" width="230" height="25"/>
  <text class="small" x="105" y="847">Ontology vocabulary and relation triples</text>

  <rect class="section" x="1345" y="655" width="335" height="210"/>
  <text class="sectionTitle" x="1367" y="688">AI and Explainability</text>
  <rect class="box boxBlue" x="1380" y="722" width="260" height="92"/>
  <text class="label" x="1404" y="754">Controlled AI Layer</text>
  <text class="small" x="1404" y="779">Ask AI and Explain Why</text>
  <text class="small" x="1404" y="801">grounded in recorded evidence</text>
  <rect class="note" x="1380" y="830" width="260" height="25"/>
  <text class="small" x="1404" y="847">LLM does not execute rules or persist telemetry</text>

  <path class="arrow" d="M312 225 H430"/>
  <path class="arrowThin" d="M640 236 H720"/>
  <path class="arrow" d="M312 320 H430"/>
  <path class="arrow" d="M650 421 H720"/>
  <path class="arrow" d="M970 436 H1030"/>
  <path class="arrow" d="M1155 485 V722"/>
  <path class="arrowThin" d="M1155 610 C1155 670 685 662 558 722"/>
  <path class="arrowThin" d="M685 768 H750"/>
  <path class="arrow" d="M970 768 H1030"/>
  <path class="arrowThin" d="M1030 570 C960 570 920 530 892 500"/>
  <path class="arrowDashed" d="M1380 371 C1320 371 1280 371 1280 371"/>
  <path class="arrowDashed" d="M970 230 C1120 210 1260 215 1380 234"/>
  <path class="arrowThin" d="M1030 760 C1010 660 1000 586 970 500"/>
  <path class="arrowThin" d="M1380 768 C1220 690 970 650 845 500"/>
  <path class="arrowDashed" d="M197 722 V375"/>

  <text class="tiny" x="352" y="216">HTTP/JSON</text>
  <text class="tiny" x="350" y="311">MQTT telemetry</text>
  <text class="tiny" x="660" y="413">subscribe</text>
  <text class="tiny" x="980" y="425">partitioned events</text>
  <text class="tiny" x="724" y="747">transactional outbox</text>
  <text class="tiny" x="997" y="747">projection feed</text>

  <rect class="note" x="50" y="900" width="1690" height="54"/>
  <text class="small" x="72" y="923">Core story: devices publish telemetry through MQTT; Go validates and produces Kafka records; scalable workers process at-least-once and persist to PostgreSQL; Neo4j is rebuilt from authoritative data.</text>
  <text class="small" x="72" y="944">Kubernetes is currently an optional kind exercise for the NestJS worker; Docker Compose remains the verified local and AWS operating model.</text>
</svg>
