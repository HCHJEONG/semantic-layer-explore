services:
  frontend:
    image: physicalai-web:${PHYSICALAI_VERSION:?set PHYSICALAI_VERSION}
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_API_ORIGIN: http://frontend:3000
      GO_GATEWAY_URL: http://api:8080
      GOOGLE_APPLICATION_CREDENTIALS: /app/gcp-key.json
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      EXPLAIN_LLM_REVIEW: ${EXPLAIN_LLM_REVIEW:-disabled}
    volumes:
      - ${GCP_KEY_ON_PRIVATE:?set GCP_KEY_ON_PRIVATE}:/app/gcp-key.json:ro
    ports:
      - "0.0.0.0:${FRONTEND_HOST_PORT:-3010}:3000"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started

  api:
    image: physicalai-api:${PHYSICALAI_VERSION:?set PHYSICALAI_VERSION}
    environment:
      API_HTTP_ADDR: :8080
      API_SSH_ADDR: :2222
      KAFKA_BROKERS: kafka:9092
      KAFKA_TELEMETRY_TOPIC: telemetry.raw
      KAFKA_GRAPH_REBUILD_TOPIC: semantic.graph.rebuild
      KAFKA_COMMAND_RESULT_TOPIC: command.result
      DATABASE_URL: postgres://physicalai:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.local}@postgres:5432/physicalai
      NEO4J_HTTP_URL: http://neo4j:7474/db/neo4j/tx/commit
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env.local}
      MQTT_URL: tcp://mosquitto:1883
      MQTT_CLIENT_ID_PREFIX: ${MQTT_CLIENT_ID_PREFIX:-pago}
      MQTT_TELEMETRY_SHARED_GROUP: ${MQTT_TELEMETRY_SHARED_GROUP:-physicalai-telemetry}
      MQTT_COMMAND_RESULT_SHARED_GROUP: ${MQTT_COMMAND_RESULT_SHARED_GROUP:-physicalai-command-results}
      MQTT_TELEMETRY_TOPIC: devices/+/telemetry
      MQTT_COMMAND_TOPIC_TEMPLATE: devices/%s/commands
      MQTT_COMMAND_RESULT_TOPIC: devices/+/command-results
      COMMAND_ACK_TIMEOUT_SECONDS: ${COMMAND_ACK_TIMEOUT_SECONDS:-10}
      MQTT_COMMAND_LEASE_SECONDS: ${MQTT_COMMAND_LEASE_SECONDS:-30}
      MQTT_COMMAND_MAX_PUBLISH_ATTEMPTS: ${MQTT_COMMAND_MAX_PUBLISH_ATTEMPTS:-3}
      MQTT_COMMAND_RETRY_INITIAL_MS: ${MQTT_COMMAND_RETRY_INITIAL_MS:-500}
      MQTT_COMMAND_RETRY_MAX_MS: ${MQTT_COMMAND_RETRY_MAX_MS:-5000}
    ports:
      - "127.0.0.1:${API_HTTP_HOST_PORT:-18080}:8080"
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started

  worker:
    image: physicalai-worker:${PHYSICALAI_VERSION:?set PHYSICALAI_VERSION}
    environment:
      NODE_OPTIONS: --max-old-space-size=256
      KAFKA_BROKERS: kafka:9092
      KAFKA_TELEMETRY_TOPIC: telemetry.raw
      KAFKA_COMMAND_RESULT_TOPIC: command.result
      KAFKA_DEAD_LETTER_TOPIC: dead-letter
      KAFKA_AGENT_RESULT_TOPIC: agent.result
      KAFKA_TELEMETRY_GROUP: physicalai-telemetry-workers
      MASTRA_TELEMETRY_MODE: ${MASTRA_TELEMETRY_MODE:-dry-run}
      MASTRA_TEMPERATURE_THRESHOLD: ${MASTRA_TEMPERATURE_THRESHOLD:-31.5}
      MASTRA_DISTANCE_THRESHOLD: ${MASTRA_DISTANCE_THRESHOLD:-10}
      DATABASE_URL: postgres://physicalai:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.local}@postgres:5432/physicalai
    restart: on-failure
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  migrate:
    image: postgres:16-alpine
    environment:
      DATABASE_URL: postgres://physicalai:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.local}@postgres:5432/physicalai
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.local}
    volumes:
      - ../infra/postgres/migrations:/migrations:ro
      - ../infra/postgres/migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/sh", "/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: physicalai
      POSTGRES_USER: physicalai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U physicalai -d physicalai"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  kafka-init:
    image: apache/kafka:3.8.0
    volumes:
      - ../infra/kafka/config/topics.sh:/topics.sh:ro
    entrypoint: ["/bin/sh", "/topics.sh"]
    depends_on:
      kafka:
        condition: service_healthy

  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ../infra/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  telemetry-simulator:
    image: physicalai-telemetry-simulator:${PHYSICALAI_VERSION:?set PHYSICALAI_VERSION}
    profiles: ["simulator"]
    environment:
      SIMULATOR_MQTT_URL: mqtt://mosquitto:1883
      SIMULATOR_TOPIC_PREFIX: devices
      SIMULATOR_DEVICE_ID: ${SIMULATOR_DEVICE_ID:-workspace-simulator-01}
      SIMULATOR_EVENTS_PER_HOUR: ${SIMULATOR_EVENTS_PER_HOUR:-60}
      SIMULATOR_SEED: ${SIMULATOR_SEED:-20260804}
      SIMULATOR_SCENARIO: ${SIMULATOR_SCENARIO:-normal}
      SIM_COMMAND_ACK_ENABLED: ${SIM_COMMAND_ACK_ENABLED:-true}
      SIM_COMMAND_ACK_DELAY_MS: ${SIM_COMMAND_ACK_DELAY_MS:-100}
      SIM_COMMAND_FAILURE_RATE: ${SIM_COMMAND_FAILURE_RATE:-0.01}
      SIM_COMMAND_ACK_DROP_RATE: ${SIM_COMMAND_ACK_DROP_RATE:-0}
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_started

  neo4j:
    image: neo4j:5-community
    profiles: ["graph"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env.local}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "127.0.0.1:${NEO4J_HTTP_HOST_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_HOST_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
    restart: unless-stopped

  graph-worker:
    image: physicalai-graph-worker:${PHYSICALAI_VERSION:?set PHYSICALAI_VERSION}
    profiles: ["graph"]
    environment:
      GRAPH_CONSUMER_GROUP: physicalai-graph-projectors
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: postgres://physicalai:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.local}@postgres:5432/physicalai
      NEO4J_HTTP_URL: http://neo4j:7474/db/neo4j/tx/commit
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env.local}
      NEO4J_URI: bolt://neo4j:7687
    restart: on-failure
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      neo4j:
        condition: service_started

volumes:
  postgres-data:
  kafka-data:
  mosquitto-data:
  neo4j-data:
