apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-graph-worker
  namespace: semantic-layer
spec:
  replicas: 1
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: rust-graph-worker }
  template:
    metadata:
      labels: { app: rust-graph-worker }
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: rust-graph-worker
          image: physicalai-graph-worker:REPLACE_ME
          imagePullPolicy: IfNotPresent
          ports:
            - { name: health, containerPort: 8081 }
          envFrom:
            - configMapRef: { name: semantic-layer-config }
          env:
            - { name: HEALTH_PORT, value: "8081" }
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: semantic-layer-secrets, key: DATABASE_URL } } }
            - { name: NEO4J_PASSWORD, valueFrom: { secretKeyRef: { name: semantic-layer-secrets, key: NEO4J_PASSWORD } } }
          startupProbe: { httpGet: { path: /health, port: health }, periodSeconds: 2, failureThreshold: 30 }
          readinessProbe: { httpGet: { path: /ready, port: health }, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 3 }
          livenessProbe: { httpGet: { path: /health, port: health }, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
