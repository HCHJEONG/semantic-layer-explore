# Example only. Create a Secret named semantic-layer-secrets through the
# cluster's secret-management path; workloads intentionally do not reference this name.
apiVersion: v1
kind: Secret
metadata:
  name: semantic-layer-secrets-example
  namespace: semantic-layer
type: Opaque
stringData:
  DATABASE_URL: postgres://physicalai:REPLACE_ME@postgres.semantic-infra.example:5432/physicalai
  NEO4J_PASSWORD: REPLACE_ME
  GOOGLE_CLOUD_PROJECT: ""
  gcp-key.json: REPLACE_WITH_SERVICE_ACCOUNT_JSON
