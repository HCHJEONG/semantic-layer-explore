apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nest-worker
  namespace: semantic-layer
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: nest-worker }
  minReplicas: 1
  maxReplicas: 6
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
