apiVersion: apps/v1
kind: Deployment
metadata:
  name: nest-worker
  namespace: semantic-layer
spec:
  replicas: 1
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: nest-worker }
  template:
    metadata:
      labels: { app: nest-worker }
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: nest-worker
          image: physicalai-worker:kind-local
          imagePullPolicy: Never
          ports:
            - { name: health, containerPort: 8081 }
          envFrom:
            - configMapRef: { name: nest-worker-config }
          env:
            - { name: NODE_OPTIONS, value: "--max-old-space-size=256" }
            - { name: HEALTH_PORT, value: "8081" }
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: semantic-layer-secrets, key: DATABASE_URL } } }
          startupProbe: { httpGet: { path: /health, port: health }, periodSeconds: 2, failureThreshold: 30 }
          readinessProbe: { httpGet: { path: /ready, port: health }, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 3 }
          livenessProbe: { httpGet: { path: /health, port: health }, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3 }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "1", memory: 384Mi }
